name: 🛡️ CI Pipeline — DevLab Logs

on:
  pull_request:
    branches:
      - dev
      - main
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pr-lint:
    name: 🔍 Validate PR & Branch
    uses: yuvadevlab/.github/.github/workflows/reusable-pr-lint.yml@main

  go-agent:
    name: 🐹 Go Collector Agent Checks
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: apps/agent/go.sum

      - name: 🔎 Go Vet, Staticcheck & Build
        run: |
          cd apps/agent
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@latest ./...
          go build -o /tmp/devlab-agent ./cmd/main.go

  validate-and-build:
    name: 🏗️ CI Validation & Build
    uses: yuvadevlab/.github/.github/workflows/reusable-ci.yml@main
    with:
      node-version: "22"
      run-tests: true
